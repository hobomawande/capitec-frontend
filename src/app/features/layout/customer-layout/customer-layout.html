<mat-sidenav-container class="layout-container">

  <mat-sidenav mode="side" opened class="sidebar">

    <div class="brand">
      <mat-icon>account_balance</mat-icon>
      <span>Capitec Booking</span>
    </div>

    <mat-nav-list>

      <a mat-list-item routerLink="/customer/dashboard"
         routerLinkActive="selected">
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle>Dashboard</span>
      </a>

      <a mat-list-item routerLink="/customer/appointments/book"
         routerLinkActive="selected">
        <mat-icon matListItemIcon>add_circle</mat-icon>
        <span matListItemTitle>Make Appointment</span>
      </a>

      <a mat-list-item routerLink="/customer/appointments"
         routerLinkActive="selected">
        <mat-icon matListItemIcon>calendar_month</mat-icon>
        <span matListItemTitle>My Appointments</span>
      </a>

    </mat-nav-list>

    <div class="sidebar-footer">
      <button mat-button (click)="logout()">
        <mat-icon>logout</mat-icon>
        Logout
      </button>
    </div>

  </mat-sidenav>

  <mat-sidenav-content>

    <mat-toolbar class="topbar">
      <span>Customer Portal</span>
      <span class="spacer"></span>

      <mat-icon>account_circle</mat-icon>
      <span class="user-label">
        {{ auth.getCurrentUser()?.firstName }}
      </span>
    </mat-toolbar>

    <main class="content">
      <router-outlet />
    </main>

  </mat-sidenav-content>

</mat-sidenav-container>
