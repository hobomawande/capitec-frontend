<div class="page-header">

  <div>
    <button
      mat-button
      routerLink="/admin/dashboard"
      class="back-button">
      <mat-icon>arrow_back</mat-icon>
      Back to Dashboard
    </button>

    <h1>Branch Management</h1>
    <p>Manage your registered branches</p>
  </div>

  <button
    mat-flat-button
    color="primary"
    (click)="createBranch()">
    <mat-icon>add</mat-icon>
    Create Branch
  </button>

</div>

<div class="table-card">

  @if (loading()) {

    <div class="loading">
      <mat-spinner diameter="40" />
    </div>

  } @else {

    <table mat-table [dataSource]="branches()">

      <!-- Branch Code -->
      <ng-container matColumnDef="branchCode">
        <th mat-header-cell *matHeaderCellDef>Code</th>
        <td mat-cell *matCellDef="let branch">
          {{ branch.branchCode }}
        </td>
      </ng-container>

      <!-- Branch Name -->
      <ng-container matColumnDef="branchName">
        <th mat-header-cell *matHeaderCellDef>Branch Name</th>
        <td mat-cell *matCellDef="let branch">
          {{ branch.branchName }}
        </td>
      </ng-container>

      <!-- City -->
      <ng-container matColumnDef="city">
        <th mat-header-cell *matHeaderCellDef>City</th>
        <td mat-cell *matCellDef="let branch">
          {{ branch.city }}
        </td>
      </ng-container>

      <!-- Province -->
      <ng-container matColumnDef="province">
        <th mat-header-cell *matHeaderCellDef>Province</th>
        <td mat-cell *matCellDef="let branch">
          {{ branch.province }}
        </td>
      </ng-container>

      <!-- Status -->
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let branch">

          <span
            [class.active]="branch.active"
            [class.inactive]="!branch.active">
            {{ branch.active ? 'Active' : 'Inactive' }}
          </span>

        </td>
      </ng-container>

      <!-- Actions -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>

        <td mat-cell *matCellDef="let branch">

          <button
            mat-icon-button
            matTooltip="Edit branch"
            (click)="editBranch(branch)">
            <mat-icon>edit</mat-icon>
          </button>

          <button
            mat-icon-button
            [matTooltip]="branch.active ? 'Deactivate' : 'Activate'"
            (click)="toggleStatus(branch)">
            <mat-icon>
              {{ branch.active ? 'toggle_on' : 'toggle_off' }}
            </mat-icon>
          </button>

        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

      <tr *matNoDataRow>
        <td colspan="6">No branches available</td>
      </tr>

    </table>

  }

</div>
