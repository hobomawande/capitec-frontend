<div class="page-header">
  <div>
    <h1>Create Branch</h1>
    <p>Add a new branch to the booking system</p>
  </div>
</div>

<mat-card class="form-card">

  <form [formGroup]="branchForm" (ngSubmit)="submit()">

    <div class="form-grid">

      <mat-form-field appearance="outline">
        <mat-label>Branch Name</mat-label>
        <input matInput formControlName="branchName">
        <mat-error>Branch name is required</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Branch Code</mat-label>
        <input matInput formControlName="branchCode">
        <mat-error>Branch code is required</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Address</mat-label>
        <input matInput formControlName="address">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>City</mat-label>
        <input matInput formControlName="city">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Province</mat-label>

        <mat-select formControlName="province">
          @for (province of provinces; track province) {
            <mat-option [value]="province">
              {{ province }}
            </mat-option>
          }
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Postal Code</mat-label>
        <input matInput formControlName="postalCode">
      </mat-form-field>

    </div>

    @if (errorMessage) {
      <p class="error-message">{{ errorMessage }}</p>
    }

    <div class="form-actions">

      <button mat-button type="button" (click)="cancel()">
        Cancel
      </button>

      <button mat-flat-button
              color="primary"
              type="submit"
              [disabled]="loading">

        {{ loading ? 'Saving...' : 'Create Branch' }}

      </button>

    </div>

  </form>

</mat-card>
